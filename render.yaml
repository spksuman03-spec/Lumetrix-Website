services:
  # Option 1: Full-Stack Single Web Service (Recommended - 1-Click Deployment)
  - type: web
    name: lumetrix-fullstack
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Option 2: Separate Backend Web Service
  - type: web
    name: lumetrix-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # Option 3: Separate Frontend Static Site
  - type: static
    name: lumetrix-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

